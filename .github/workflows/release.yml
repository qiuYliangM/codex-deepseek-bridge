name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  native-installers:
    uses: ./.github/workflows/installers.yml
  publish:
    needs: native-installers
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    env:
      RELEASE_TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22.19.0'
      - name: Verify release version
        run: node --input-type=module -e 'import fs from "node:fs"; const p=JSON.parse(fs.readFileSync("package.json")); if (process.env.RELEASE_TAG !== `v${p.version}`) throw Error("Tag and package version differ")'
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm test
      - run: npm run package
      - run: npm run test:package
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: installer-*
          merge-multiple: true
          path: dist/installers
      - name: Verify native installer checksums
        working-directory: dist/installers
        run: sha256sum --check *.sha256
      - name: Publish installers, tarball and checksums
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cat dist/installers/*.sha256 >> dist/SHA256SUMS
          gh release create "$RELEASE_TAG" dist/peerbridge-*.tgz dist/SHA256SUMS dist/installers/*.deb dist/installers/*.exe dist/installers/*.pkg dist/installers/*.sha256 dist/installers/native-*.json --verify-tag --title "Codex DeepSeek Bridge $RELEASE_TAG" --generate-notes
